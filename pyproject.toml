[project]
name = "autoapply"
version = "0.1.0"
description = "Agente LLM que busca vagas, adapta seu currículo dinamicamente e aplica (ou alerta via Telegram)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "litellm>=1.40",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "Jinja2>=3.1",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
apply = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
autoapply = "autoapply.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoapply*"]

# templates/ não é um pacote Python; sem isto o .j2 não vai para o site-packages e
# rendering.render_resume() quebra com TemplateNotFound na imagem Docker.
[tool.setuptools.package-data]
autoapply = ["templates/*.j2"]
